name: Production deployment verification

# Runs on demand only.
#
# GitHub Actions minutes on this account are exhausted every month, and while
# they are, every triggered run fails in about four seconds with steps: []
# having done nothing. Deployment does not depend on Actions - Cloudflare builds
# each push from Git - so automatic triggers here only consumed the budget and
# painted healthy commits red.
#
# Run this from the Actions tab (Run workflow) when you actually want it, or
# locally with the commands it wraps. Do not re-add a push trigger unless the
# minutes budget is raised enough to carry it.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nine-gates-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NGM_PRODUCTION_ORIGIN: https://ninegatesmahjong.com
      NGM_PRODUCTION_MAX_ATTEMPTS: '30'
      NGM_PRODUCTION_RETRY_DELAY_MS: '10000'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify deployed Cloudflare release
        run: node scripts/production-smoke.mjs
