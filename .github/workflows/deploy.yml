name: Deploy Cloudflare production (manual fallback)

# MANUAL FALLBACK ONLY - this workflow no longer runs on push.
#
# Production deploys are handled by Cloudflare Workers Builds, which builds and
# deploys every push to master by itself and needs neither GitHub Actions
# minutes nor a Cloudflare API token. See DEPLOYMENT.md for the dashboard
# settings (Workers & Pages -> nine-gates-mahjong -> Settings -> Build ->
# Connect to Git; build `npm run build`, deploy `npx wrangler deploy`, branch
# master).
#
# This file previously triggered on push to master and was the only way the
# repository deployed. It could never honour that: the account Actions spending
# limit is exhausted, so runs end in ~4s with steps: [] and the annotation "The
# job was not started because an Actions budget is preventing further use".
# That is a billing setting at https://github.com/settings/billing, not a
# configuration problem.
#
# The D1 schema step below runs here only because this path is explicitly
# invoked by a human. The automatic Workers Builds path deploys code only, so an
# ordinary commit cannot write to the production database.
#
# To ship by hand from a clean checkout of master instead:
#
#   npm ci && npm run build && npx wrangler deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nine-gates-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Repository secret CLOUDFLARE_API_TOKEN is not configured."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Repository secret CLOUDFLARE_ACCOUNT_ID is not configured."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and build production assets
        run: npm run build

      - name: Apply idempotent D1 schema
        run: npx wrangler d1 execute DB --remote --file=src/worker/db/migrations/0001_initial.sql

      - name: Deploy Worker and static assets
        run: npx wrangler deploy
